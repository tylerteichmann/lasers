[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lasers"
version = "0.0.2"
description = "A Python library of laser physics equations for researchers and engineers."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tyler Teichmann", email = "tyler.j.teichmann@gmail.com" }]
keywords = ["laser", "optics", "photonics", "beam quality", "spectral linewidth", "fluence", "M-squared", "BPP"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/tylerteichmann/lasers"
Source = "https://github.com/tylerteichmann/lasers"
"Bug Tracker" = "https://github.com/tylerteichmann/lasers/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "scipy-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["src/lasers"]
