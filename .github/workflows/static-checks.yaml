name: Static Checks

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pip install ruff
      - run: ruff format --check .

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pip install ".[dev]"
      - run: mypy src
      - run: mypy tests
