name: Setup
description: Install Python and install the package with dev dependencies.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - run: pip install ".[dev]"
      shell: bash
